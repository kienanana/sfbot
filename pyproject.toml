[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sfbot"
version = "0.1.0"
description = "A Telegram bot that calls out repeated Twitter/X posts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
sfbot = "sfbot.__main__:main"

[tool.setuptools.packages.find]
include = ["sfbot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

